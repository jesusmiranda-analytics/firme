<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbf6ee" />
    <script>
      // Tema guardado por quien presenta; sin preferencia, la página abre en claro (crema).
      try {
        if (localStorage.getItem('firme-tema') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#10201f');
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Firme: tu primer empleo, firme. Prototipo del equipo Delions para el Hackathon Cantera." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Firme · Tu primer empleo, firme</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
